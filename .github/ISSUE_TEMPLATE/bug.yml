name: Something's wrong
description: The page shows something wrong, or Overlook doesn't start.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Overlook's version
      description: The release, or the commit you built.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: The part of overlook.yaml that matters
      description: Leave out every key, password and host of yours.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: What Overlook logged
      render: text
  - type: input
    id: browser
    attributes:
      label: Your browser, if it's about the page
