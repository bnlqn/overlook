# Dependabot keeps the one dependency current (ADR 0003), and the actions CI
# runs, which are pinned by commit, in one pull request a week.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: Update
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: Update
    groups:
      actions:
        patterns: ["*"]
