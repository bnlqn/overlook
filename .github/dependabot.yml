# Dependabot keeps the one dependency current (ADR 0003), the actions CI and
# releases run, pinned by commit, in one pull request a week, and the image the
# Dockerfile takes its certificates from.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: Update
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: Update
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: Update
