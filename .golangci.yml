# golangci-lint v2: `golangci-lint run` and `golangci-lint fmt`.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - thelper
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: unused-parameter
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests hold invented credentials and paths by design.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bnlqn/overlook
