# A scratch Audiobookshelf to record from (ADR 0008): fill.sh fills it with
# invented audiobooks and podcasts, people who listen to them and episodes
# waiting to download, then record.sh reads what Overlook reads.
#
#   docker compose -p overlook-audiobookshelf -f compose.yaml up -d
#   ./record.sh "$(./fill.sh)"
#   docker compose -p overlook-audiobookshelf -f compose.yaml down -v
services:
  audiobookshelf:
    image: advplyr/audiobookshelf:2.37.2
    ports: ["127.0.0.1:13378:80"]
    environment:
      # The episodes come from podcasts.example.com, below, on Docker's own
      # network, which Audiobookshelf refuses unless told, and wait for it
      # for a day rather than the half a minute it gives a real feed.
      SSRF_REQUEST_FILTER_WHITELIST: podcasts.example.com
      PODCAST_DOWNLOAD_TIMEOUT: "86400000"
    volumes:
      - config:/config
      - metadata:/metadata
      - audiobooks:/audiobooks
      - podcasts:/podcasts
  # A podcast's host that takes the connection and never answers, so that
  # the first episode asked of it stays downloading and the rest wait.
  podcasts:
    image: advplyr/audiobookshelf:2.37.2
    entrypoint: ["node", "-e", "require('net').createServer(() => {}).listen(80)"]
    networks:
      default:
        aliases: [podcasts.example.com]
volumes:
  config:
  metadata:
  audiobooks:
  podcasts:
