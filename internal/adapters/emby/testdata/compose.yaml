# A scratch Emby to record from (ADR 0008): fill.sh fills it with invented
# users, films and shows, then record.sh reads what Overlook reads.
#
#   docker compose -p overlook-emby -f compose.yaml up -d
#   ./record.sh "$(./fill.sh)"
#   docker compose -p overlook-emby -f compose.yaml down -v
services:
  emby:
    image: emby/embyserver:4.10.2.0
    ports: ["127.0.0.1:8096:8096"]
    volumes:
      - config:/config
      - media:/media
volumes:
  config:
  media:
