# A scratch Forgejo to record from (ADR 0008), with two Actions runners that
# run jobs in their own containers: fill.sh gives it invented repositories,
# pull requests from a user named like Renovate and a workflow that fails,
# stops one runner, then record.sh reads what Overlook reads.
#
#   docker compose -f compose.yaml up -d forgejo && ./fill.sh && ./record.sh <token>
#   docker compose -f compose.yaml down -v
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1
    ports: ["127.0.0.1:3011:3000"]
    environment:
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__ROOT_URL: http://localhost:3011/
      FORGEJO__database__DB_TYPE: sqlite3
    volumes: [forgejo:/data]
  runner:
    image: code.forgejo.org/forgejo/runner:13.2.1
    environment: &runner
      RUNNER_TOKEN: ${RUNNER_TOKEN:-} # fill.sh's
      RUNNER_NAME: rack-runner
    # It registers once, with jobs run in the runner itself, then runs them.
    command: >-
      sh -c 'cd /data && { test -f .runner || forgejo-runner register --no-interactive
      --instance http://forgejo:3000 --token "$$RUNNER_TOKEN" --name "$$RUNNER_NAME" --labels host:host; }
      && forgejo-runner daemon'
    volumes: [runner:/data]
  spare:
    image: code.forgejo.org/forgejo/runner:13.2.1
    environment:
      <<: *runner
      RUNNER_NAME: spare-runner
    command: >-
      sh -c 'cd /data && { test -f .runner || forgejo-runner register --no-interactive
      --instance http://forgejo:3000 --token "$$RUNNER_TOKEN" --name "$$RUNNER_NAME" --labels host:host; }
      && forgejo-runner daemon'
    volumes: [spare:/data]
volumes:
  forgejo:
  runner:
  spare:
