# A scratch Gitea to record from (ADR 0008), with two Actions runners that
# run jobs in their own containers: fill.sh gives it invented repositories,
# pull requests from a user named like Renovate and a workflow that fails,
# stops one runner, then record.sh reads what Overlook reads.
#
#   docker compose -p overlook-gitea up -d --wait && ./record.sh "$(./fill.sh)"
#   docker compose -p overlook-gitea down -v
services:
  gitea:
    image: gitea/gitea:28.3.0
    ports: ["127.0.0.1:3010:3000"]
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://localhost:3010/
      GITEA__database__DB_TYPE: sqlite3
    volumes: [gitea:/data]
  runner:
    profiles: [runners] # fill.sh starts them, once it has their token
    image: gitea/act_runner:0.6.1
    environment: &runner
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${RUNNER_TOKEN:-} # fill.sh's
      GITEA_RUNNER_LABELS: host:host # jobs run in the runner itself
      GITEA_RUNNER_NAME: rack-runner
    volumes: [runner:/data]
  spare:
    profiles: [runners] # fill.sh starts them, once it has their token
    image: gitea/act_runner:0.6.1
    environment:
      <<: *runner
      GITEA_RUNNER_NAME: spare-runner
    volumes: [spare:/data]
volumes:
  gitea:
  runner:
  spare:
