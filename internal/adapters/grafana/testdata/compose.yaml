# A scratch Grafana to record from (ADR 0008): fill.sh gives it alert rules
# in folders named like Overlook's areas, over its own test data, and
# Overlook a service account, then record.sh reads what Overlook reads.
#
#   docker compose -f compose.yaml up -d && ./fill.sh && ./record.sh
#   docker compose -f compose.yaml down -v
services:
  grafana:
    image: grafana/grafana:13.3.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: owner
      GF_SECURITY_ADMIN_PASSWORD: owner-password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - data:/var/lib/grafana
volumes:
  data:
