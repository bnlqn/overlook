# A scratch Home Assistant to record from (ADR 0008): configuration.yaml gives
# it invented lights, sensors, batteries and updates, fill.sh answers its
# first run's questions and makes Overlook's user, then record.sh reads what
# Overlook reads.
#
#   docker compose -f compose.yaml up -d && ./fill.sh && ./record.sh
#   docker compose -f compose.yaml down -v
services:
  homeassistant:
    image: homeassistant/home-assistant:2026.10.4
    ports: ["127.0.0.1:8123:8123"]
    volumes:
      - config:/config
      - ./configuration.yaml:/config/configuration.yaml:ro
volumes:
  config:
