# The scratch Home Assistant's config: Home Assistant's own invented devices,
# and a few more to show what Overlook makes of a low battery, a device that
# dropped off and an automation that's broken.
homeassistant:
  name: Home
  time_zone: Europe/London
  country: GB
  unit_system: metric
  currency: GBP
  latitude: 51.5
  longitude: -0.12
  elevation: 10
http:
config:
frontend:
demo:

template:
  - sensor:
      - name: Hall motion battery
        unique_id: hall_motion_battery
        device_class: battery
        unit_of_measurement: "%"
        state: "12"
      - name: Garden gate battery
        unique_id: garden_gate_battery
        device_class: battery
        unit_of_measurement: "%"
        state: "6"
      - name: Kitchen thermometer battery
        unique_id: kitchen_thermometer_battery
        device_class: battery
        unit_of_measurement: "%"
        state: "64"
  - binary_sensor:
      - name: Garage door
        unique_id: garage_door
        device_class: garage_door
        state: "off"
        availability: "false"

automation:
  - id: porch_light
    alias: Porch light at sunset
    triggers:
      - trigger: sun
        event: sunset
    actions:
      - action: light.turn_on
        target:
          entity_id: light.living_room_rgbww_lights
  - id: lights_off
    alias: Lights off at midnight
    triggers:
      - trigger: time
        at: "00:00:00"
    actions:
      - action: light.turn_off
        target:
          entity_id: all
  - id: heating_boost
    alias: Heating boost
    triggers:
      - trigger: no_such_trigger
    actions:
      - action: climate.turn_on
