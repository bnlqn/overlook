# A scratch Jellyfin to record from (ADR 0008): fill.sh fills it with
# invented users, films and shows, then record.sh reads what Overlook reads.
#
#   docker compose -f compose.yaml up -d && ./fill.sh && ./record.sh
#   docker compose -f compose.yaml down -v
services:
  jellyfin:
    image: jellyfin/jellyfin:12.4.20261026-211555
    ports: ["127.0.0.1:8096:8096"]
    volumes:
      - config:/config
      - media:/media
volumes:
  config:
  media:
