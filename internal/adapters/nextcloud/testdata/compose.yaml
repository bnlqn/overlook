# A scratch Nextcloud to record from (ADR 0008): it installs itself with
# SQLite, fill.sh gives it invented people, files and shares and Overlook its
# serverinfo token, then record.sh reads what Overlook reads.
#
#   docker compose -f compose.yaml up -d && ./fill.sh && ./record.sh
#   docker compose -f compose.yaml down -v
services:
  nextcloud:
    image: nextcloud:35.0.2-apache
    ports: ["127.0.0.1:8082:80"]
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: owner
      NEXTCLOUD_ADMIN_PASSWORD: owner-password-1
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    volumes:
      - html:/var/www/html
volumes:
  html:
