# A scratch Portainer to record from (ADR 0008): it manages two Docker
# engines of its own, each Docker in Docker, and fill.sh gives the first
# invented containers and a stack, stops the second, and makes Overlook a
# user of its own, then record.sh reads what Overlook reads.
#
#   docker compose -f compose.yaml up -d && ./fill.sh && ./record.sh
#   docker compose -f compose.yaml down -v
services:
  portainer:
    image: portainer/portainer-ce:2.45.3
    command: --no-setup-token # fill.sh sets the admin's password straight away
    ports: ["127.0.0.1:9000:9000"]
    volumes:
      - data:/data
  media:
    image: docker:29.9.3-dind # pinned: an engine Portainer reads, not the source
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: "" # plain TCP on 2375, inside this network only
  backups:
    image: docker:29.9.3-dind # pinned: an engine Portainer reads, not the source
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
volumes:
  data:
