# A scratch Prometheus and Alertmanager to record from (ADR 0008):
# prometheus.yml and rules.yml give Prometheus invented alert rules over
# numbers of its own, in groups named like Overlook's areas, evaluated every
# 10 seconds, and fill.sh silences one in Alertmanager, waits for history,
# then record.sh reads what Overlook reads.
#
#   docker compose -f compose.yaml up -d && ./fill.sh && ./record.sh
#   docker compose -f compose.yaml down -v
services:
  prometheus:
    image: prom/prometheus:v3.15.1
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules.yml:/etc/prometheus/rules.yml:ro
      - data:/prometheus
  alertmanager:
    image: prom/alertmanager:v0.34.2
    ports: ["127.0.0.1:9093:9093"]
volumes:
  data:
