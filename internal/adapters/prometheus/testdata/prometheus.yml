# The scratch Prometheus's config: it evaluates rules.yml every 10 seconds and
# sends what fires to Alertmanager.
global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
