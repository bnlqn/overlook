# A scratch Seerr to record from (ADR 0008), with the scratch Jellyfin its
# first run asks for: fill.sh makes the owner and two invented people, who
# ask for films and a show, then record.sh reads what Overlook reads.
#
#   docker compose -f compose.yaml up -d && ./fill.sh && ./record.sh
#   docker compose -f compose.yaml down -v
services:
  jellyfin:
    image: jellyfin/jellyfin:12.4.20261026-211555
    ports: ["127.0.0.1:8097:8096"] # for fill.sh's first run
    volumes:
      - jellyfin:/config
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.1
    ports: ["127.0.0.1:5055:5055"]
    environment:
      TZ: Europe/London
    volumes:
      - seerr:/app/config
volumes:
  jellyfin:
  seerr:
