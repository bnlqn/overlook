# A scratch Syncthing to record from (ADR 0008): home is the one Overlook
# reads, and fill.sh makes laptop, nas and phone its devices, shares invented
# folders between them, stops nas, has phone ask to join and laptop offer a
# folder, then record.sh reads what Overlook reads from home.
#
#   docker compose -f compose.yaml up -d && ./fill.sh && ./record.sh
#   docker compose -f compose.yaml down -v
x-syncthing: &syncthing
  image: syncthing/syncthing:2.1.7
  environment:
    STGUIAPIKEY: scratch-instance-only-not-a-key # each one's API key
services:
  home:
    <<: *syncthing
    hostname: home
    ports: ["127.0.0.1:8384:8384"]
    volumes: [home:/var/syncthing]
  laptop:
    <<: *syncthing
    hostname: laptop
    volumes: [laptop:/var/syncthing]
  nas:
    <<: *syncthing
    hostname: nas
    volumes: [nas:/var/syncthing]
  phone:
    <<: *syncthing
    hostname: phone
    volumes: [phone:/var/syncthing]
volumes:
  home:
  laptop:
  nas:
  phone:
