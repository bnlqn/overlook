# A scratch Traefik to record from (ADR 0008): its routers, services and
# middlewares are invented, in dynamic.yaml, and its apps are one whoami
# under several names. fill.sh makes it two self-signed certificates, one
# expiring soon, then record.sh reads what Overlook reads, through the API's
# own router behind a basicAuth middleware.
#
#   docker compose -f compose.yaml up -d && ./fill.sh && ./record.sh
#   docker compose -f compose.yaml down -v
name: overlook-traefik
services:
  traefik:
    image: traefik:v3.7.17
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api=true
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    ports: ["127.0.0.1:8088:80"]
    volumes:
      - ./dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - certs:/certs
  whoami:
    image: traefik/whoami:v1.11.0
    networks:
      default:
        aliases: [photos, films, wiki, blog, printer, shop-blue]
volumes:
  certs:
