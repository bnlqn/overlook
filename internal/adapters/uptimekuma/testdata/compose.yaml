# A scratch Uptime Kuma to record from (ADR 0008): fill.mjs makes its owner,
# invented monitors and a status page of them, then record.sh reads what
# Overlook reads, the status page, once the monitors have half an hour of
# results.
#
#   docker compose -f compose.yaml up -d && node fill.mjs && ./record.sh
#   docker compose -f compose.yaml down -v
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.8
    ports: ["127.0.0.1:3001:3001"]
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite # skips the first run's question
    volumes:
      - data:/app/data
volumes:
  data:
