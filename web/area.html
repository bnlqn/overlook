<!doctype html>
<!--
  An area's page, at /servers, /network, /storage and /apps: the area's
  state and checks, its charts by the hour, then each section its sources
  add. Drawn by js/area.js
  from the snapshot.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<!-- The bar a phone draws above the page, in the panel's colour, light or
     dark (style.css), as theme.js picks. -->
<meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)" data-theme="light">
<meta name="theme-color" content="#101112" data-theme="dark">
<!-- The look the viewer chose, or the system's, before anything is drawn. -->
<script src="js/theme.js"></script>
<title></title>
<link rel="icon" href="icon.svg">
<!-- apple-touch-icon.png is icon.svg on a square of its own, 512 px, for a
     phone to round or cut. Both are named in the manifest, which installs
     the page. An iPhone adds the page to its home screen without the
     browser's cookies, so behind a login it can't read this link, and asks
     for the icon by that name at the root, which the owner lets through the
     login (README, No login). -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="custom.css">
</head>
<body>
<main>
  <header class="head">
    <h1 id="title"></h1>
    <p id="summary" data-t="loading"></p>
  </header>
  <section id="checks" hidden>
    <h2 class="block-title"><span data-t="palette.checks"></span><span class="hint" data-t="area.checks_hint"></span></h2>
    <div class="card"><div class="checks"></div></div>
  </section>
  <div id="charts"></div>
  <div class="columns" id="sections"></div>
</main>
<script type="module" src="js/area.js"></script>
</body>
</html>
